name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU-only: no CUDA on the runner. nudenet is installed without deps
      # because it is only needed for its bundled 320n.onnx model file.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless onnxruntime tqdm pytest pytest-cov ruff
          pip install --no-deps nudenet

      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Test
        run: python -m pytest -q --cov=. --cov-report=term-missing
